name: AttendPlan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend Quality Gate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Security & Sanitization Audit
        run: |
          pytest backend/tests/test_sanitization.py -v

      - name: Run Ruff Linting
        run: |
          ruff check backend/app backend/tests backend/launcher.py

      - name: Run Mypy Typecheck
        run: |
          mypy backend/app backend/launcher.py

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests -v

  frontend-verification:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Run Vitest Suite
        run: |
          npx vitest run

      - name: Run TypeScript Compile Check
        run: |
          npx tsc --noEmit

      - name: Run Production Bundle Build
        run: |
          npm run build
